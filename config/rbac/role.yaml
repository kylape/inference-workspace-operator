apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-workspace-operator
rules:
  - apiGroups:
      - inference.redhat.com
    resources:
      - inferenceworkspaces
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - inference.redhat.com
    resources:
      - inferenceworkspaces/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - inference.redhat.com
    resources:
      - inferenceworkspaces/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - rolebindings
      - roles
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - inference-workspace-user
      - inference-workspace-vcluster
    verbs:
      - bind
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - localqueues
      - clusterqueues
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - localqueues
    verbs:
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - endpoints
      - events
      - persistentvolumeclaims
      - pods
      - pods/attach
      - pods/ephemeralcontainers
      - pods/exec
      - pods/log
      - pods/portforward
      - pods/resize
      - pods/status
      - secrets
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - get
      - list
      - watch
