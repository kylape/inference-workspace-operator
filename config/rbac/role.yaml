apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-workspace-operator
rules:
  - apiGroups:
      - inference.redhat.com
    resources:
      - inferenceworkspaces
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - inference.redhat.com
    resources:
      - inferenceworkspaces/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - inference.redhat.com
    resources:
      - inferenceworkspaces/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - inference-workspace-user
    verbs:
      - bind
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - localqueues
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
